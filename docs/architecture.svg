<text x="1140" y="664" font-size="11" font-weight="400" fill="#5c5c5c" text-anchor="middle" letter-spacing="0">live alert</text>
<line x1="1220" y1="790" x2="1062" y2="790" stroke="#171717" stroke-width="2.2" marker-end="url(#a)" marker-start="url(#a)"/>
<rect x="1094.5" y="761" width="91.0" height="22" rx="11" fill="#fff" stroke="#171717" stroke-width="1.6"/>
