<text x="1220" y="186" font-size="22" font-weight="800" fill="#171717" text-anchor="start" letter-spacing="0">React Dashboard</text>
<text x="1220" y="206" font-size="12" font-weight="400" fill="#5c5c5c" text-anchor="start" letter-spacing="0" font-family="DejaVu Sans Mono">frontend · React + Vite</text>
